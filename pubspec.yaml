name: efatura_app
description: GİB eArşiv Fatura Uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP
  dio: ^5.3.4

  # Local storage
  sqflite: ^2.3.0
  path: ^1.8.3

  # Secure storage (credentials)
  flutter_secure_storage: ^8.1.0

  # UUID generation
  uuid: ^4.2.2

  # Date picker
  intl: ^0.18.1
  month_picker_dialog: ^2.0.0

  # WebView for invoice preview
  webview_flutter: ^4.4.4

  # Icons
  cupertino_icons: ^1.0.6

  # PDF generation & printing
  pdf: ^3.10.7
  printing: ^5.11.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

